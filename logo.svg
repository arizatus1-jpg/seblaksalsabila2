<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" width="500">
  <!-- Gradasi -->
  <defs>
    <linearGradient id="mangkukGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F06292"/>
      <stop offset="100%" stop-color="#AD1457"/>
    </linearGradient>
    <linearGradient id="kuahGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFAB91"/>
      <stop offset="100%" stop-color="#E64A19"/>
    </linearGradient>
  </defs>

  <!-- Mangkuk -->
  <ellipse cx="160" cy="180" rx="100" ry="35" fill="url(#mangkukGrad)" stroke="#6A1B9A" stroke-width="4"/>
  <ellipse cx="160" cy="170" rx="80" ry="20" fill="url(#kuahGrad)" stroke="#BF360C" stroke-width="3"/>

  <!-- Uap -->
  <path d="M130 100 C127 85, 145 85, 140 70 
           M150 100 C147 85, 165 85, 160 70 
           M170 100 C167 85, 185 85, 180 70" 
        stroke="#F57C00" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.8"/>

  <!-- Topping: bakso -->
  <circle cx="130" cy="160" r="8" fill="#A1887F"/>
  <circle cx="155" cy="165" r="8" fill="#A1887F"/>

  <!-- Topping: sosis -->
  <ellipse cx="180" cy="162" rx="10" ry="4.5" fill="#D84315" />
  <ellipse cx="200" cy="160" rx="10" ry="4.5" fill="#D84315" />

  <!-- Topping: cabai -->
  <path d="M140 150 Q144 148, 148 150 Q144 152, 140 150" fill="#C62828" />
  <path d="M185 152 Q189 150, 193 152 Q189 154, 185 152" fill="#C62828" />

  <!-- Topping: kerupuk -->
  <circle cx="115" cy="158" r="5" fill="#FFD180" stroke="#FBC02D" stroke-width="1.5"/>
  <circle cx="205" cy="164" r="5" fill="#FFD180" stroke="#FBC02D" stroke-width="1.5"/>

  <!-- Topping: daun bawang -->
  <rect x="155" y="152" width="4" height="10" fill="#388E3C" rx="1"/>
  <rect x="165" y="150" width="4" height="10" fill="#43A047" rx="1"/>

  <!-- Topping: telur irisan -->
  <ellipse cx="140" cy="168" rx="6" ry="3.5" fill="#FFF9C4" stroke="#FDD835" stroke-width="1.2"/>

  <!-- Teks -->
  <text x="300" y="140" font-family="Poppins, sans-serif" font-size="64" font-weight="700" fill="#E91E63">Seblak</text>
  <text x="300" y="210" font-family="Poppins, sans-serif" font-size="56" font-weight="600" fill="#F57C00">Salsabila 2</text>
</svg>
